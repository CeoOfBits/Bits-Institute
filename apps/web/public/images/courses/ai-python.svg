<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.15" stroke="#818CF8" stroke-width="0.8">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Neural Mesh Connections -->
  <g stroke="url(#nodeGrad)" stroke-width="1.8" opacity="0.6">
    <line x1="120" y1="150" x2="260" y2="100" />
    <line x1="120" y1="150" x2="260" y2="200" />
    <line x1="120" y1="300" x2="260" y2="200" />
    <line x1="120" y1="300" x2="260" y2="340" />

    <line x1="260" y1="100" x2="400" y2="80" />
    <line x1="260" y1="100" x2="400" y2="180" />
    <line x1="260" y1="200" x2="400" y2="180" />
    <line x1="260" y1="200" x2="400" y2="280" />
    <line x1="260" y1="340" x2="400" y2="280" />
    <line x1="260" y1="340" x2="400" y2="370" />

    <line x1="400" y1="80" x2="540" y2="120" />
    <line x1="400" y1="180" x2="540" y2="120" />
    <line x1="400" y1="180" x2="540" y2="240" />
    <line x1="400" y1="280" x2="540" y2="240" />
    <line x1="400" y1="370" x2="540" y2="320" />

    <line x1="540" y1="120" x2="680" y2="180" />
    <line x1="540" y1="240" x2="680" y2="180" />
    <line x1="540" y1="240" x2="680" y2="280" />
    <line x1="540" y1="320" x2="680" y2="280" />
  </g>

  <!-- Glowing Brain / AI Core Nodes -->
  <g filter="url(#glow)">
    <circle cx="120" cy="150" r="9" fill="#06B6D4" />
    <circle cx="120" cy="300" r="9" fill="#06B6D4" />

    <circle cx="260" cy="100" r="10" fill="#38BDF8" />
    <circle cx="260" cy="200" r="12" fill="#818CF8" />
    <circle cx="260" cy="340" r="10" fill="#38BDF8" />

    <circle cx="400" cy="80" r="11" fill="#A855F7" />
    <circle cx="400" cy="180" r="16" fill="#C084FC" />
    <circle cx="400" cy="280" r="14" fill="#A855F7" />
    <circle cx="400" cy="370" r="10" fill="#818CF8" />

    <circle cx="540" cy="120" r="12" fill="#F472B6" />
    <circle cx="540" cy="240" r="14" fill="#E879F9" />
    <circle cx="540" cy="320" r="11" fill="#C084FC" />

    <circle cx="680" cy="180" r="13" fill="#38BDF8" />
    <circle cx="680" cy="280" r="13" fill="#06B6D4" />
  </g>

  <!-- Floating Data Badges -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
    <!-- Neural Model Badge -->
    <rect x="330" y="25" width="140" height="28" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" />
    <text x="400" y="44" fill="#E0E7FF" text-anchor="middle">Neural Architecture</text>

    <!-- Deep Learning Nodes -->
    <rect x="570" y="390" width="150" height="28" rx="14" fill="#1E1B4B" stroke="#A855F7" stroke-width="1.5" />
    <text x="645" y="409" fill="#F3E8FF" text-anchor="middle">PyTorch & LLM Fine-Tuning</text>
  </g>
</svg>
